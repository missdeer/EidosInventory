{{define "users.html"}}{{template "header" .}}<div class="mb-4"><h1 class="h3 mb-1">账号管理</h1><p class="muted mb-0">管理员可创建账号、调整权限和重设密码。</p></div><div class="row g-4"><div class="col-lg-5"><div class="card"><div class="card-body p-4"><h2 class="h5 mb-3">创建账号</h2><form method="post" action="/users"><input type="hidden" name="csrf" value="{{.CSRF}}"><div class="mb-3"><label class="form-label" for="username">账号</label><input class="form-control" id="username" name="username" minlength="3" maxlength="80" required autocomplete="off"></div><div class="mb-3"><label class="form-label" for="password">初始密码</label><input class="form-control" type="password" id="password" name="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><div class="mb-4"><label class="form-label" for="role">权限</label><select class="form-select" id="role" name="role"><option value="viewer">只读</option><option value="editor">读写</option><option value="admin">管理员</option></select></div><button class="btn btn-primary">创建账号</button></form></div></div></div><div class="col-lg-7"><div class="card"><div class="card-body p-4"><h2 class="h5 mb-3">现有账号</h2><div class="table-responsive"><table class="table mb-0"><thead><tr><th>账号</th><th>权限 / 新密码</th><th></th></tr></thead><tbody>{{range .Users}}<tr><td class="fw-semibold">{{.Username}}</td><td colspan="2"><form method="post" action="/users/{{.ID}}" class="row g-2"><input type="hidden" name="csrf" value="{{$.CSRF}}"><div class="col-12 col-md-4"><select class="form-select form-select-sm" name="role"><option value="viewer" {{if eq .Role "viewer"}}selected{{end}}>只读</option><option value="editor" {{if eq .Role "editor"}}selected{{end}}>读写</option><option value="admin" {{if eq .Role "admin"}}selected{{end}}>管理员</option></select></div><div class="col-12 col-md-5"><input class="form-control form-control-sm" type="password" name="password" minlength="8" placeholder="留空则不改密码" autocomplete="new-password"></div><div class="col-12 col-md-3"><button class="btn btn-sm btn-outline-primary w-100">保存</button></div></form></td></tr>{{end}}</tbody></table></div></div></div></div></div>{{template "footer" .}}{{end}}
