{{define "login.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · Eidos 库存</title><link href="https://cdn.staticfile.net/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" onerror="this.onerror=function(){this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'};this.href='https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css'"><style>body{background:#f2f5f8;min-height:100vh;display:grid;place-items:center}.login-card{width:min(100% - 2rem,410px);border:0;box-shadow:0 15px 50px #182f4820}.brand{color:#16304d}</style></head><body><div class="card login-card"><div class="card-body p-4 p-md-5"><div class="mb-4"><div class="text-uppercase text-secondary small fw-bold mb-2">Studio inventory</div><h1 class="h3 brand mb-1">工作室资产台账</h1><p class="text-secondary mb-0">请使用分配的账号登录</p></div>{{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}<form method="post" action="/login"><div class="mb-3"><label class="form-label" for="username">账号</label><input id="username" name="username" class="form-control form-control-lg" autocomplete="username" required autofocus></div><div class="mb-4"><label class="form-label" for="password">密码</label><input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required></div><button class="btn btn-primary btn-lg w-100">登录</button></form></div></div></body></html>{{end}}
