{{define "header"}}
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Title}} · Eidos 库存</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f6f7f9;color:#1d2734}.navbar{background:#162c46}.brand-mark{display:inline-block;width:10px;height:10px;border-radius:3px;background:#f0ad58;margin-right:.5rem}.card{border:0;box-shadow:0 2px 14px #19304a0d}.stat{font-size:1.8rem;font-weight:700}.asset-photo{width:52px;height:52px;object-fit:cover;border-radius:.5rem;background:#e9edf2}.asset-photo.empty{display:grid;place-items:center;color:#8793a1;font-size:.7rem}.table td{vertical-align:middle}.muted{color:#667487}.form-label{font-weight:600;font-size:.92rem}@media(max-width:767px){.table-responsive{border-radius:.75rem}.mobile-stack{display:block}.mobile-stack>*{width:100%;margin-bottom:.5rem}}</style>
</head><body><nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand fw-semibold" href="/"><span class="brand-mark"></span>Eidos 库存</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav me-auto"><a class="nav-link" href="/">资产台账</a>{{if canAdmin .User.Role}}<a class="nav-link" href="/users">账号管理</a><a class="nav-link" href="/options">可选值管理</a>{{end}}</div><div class="navbar-nav align-items-lg-center"><span class="navbar-text me-lg-3">{{.User.Username}} · {{if eq .User.Role "admin"}}管理员{{else if eq .User.Role "editor"}}读写{{else}}只读{{end}}</span><form method="post" action="/logout" class="d-inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="btn btn-sm btn-outline-light">退出</button></form></div></div></div></nav>
<main class="container py-4 py-md-5">{{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}{{if .Notice}}<div class="alert alert-success" role="status">{{.Notice}}</div>{{end}}
{{end}}
